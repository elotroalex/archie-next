
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Native Land Digital territory map</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fff;
    }

    .map-shell {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: 100%;
      height: 100%;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    .map-toolbar {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.35rem 0.5rem;
      color: #555;
      background: #fff;
    }

    #locate-me {
      flex: 0 0 auto;
      border: 1px solid #777;
      border-radius: 2px;
      padding: 0.25rem 0.55rem;
      color: #333;
      background: #fff;
      font: inherit;
      font-size: 0.75rem;
      cursor: pointer;
    }

    #locate-me:hover,
    #locate-me:focus-visible {
      border-color: #d0181f;
      color: #d0181f;
      outline: none;
    }

    #locate-me:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    #location-status {
      margin: 0;
      font-size: 0.68rem;
      line-height: 1.2;
    }

    #native-land-map {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="map-shell">
    <div class="map-toolbar">
      <button id="locate-me" type="button">locate me</button>
      <p id="location-status" role="status" aria-live="polite">
        Showing Nipmuc territory. If you choose “locate me,” your approximate coordinates are sent to Native Land Digital.
      </p>
    </div>

    <iframe
      id="native-land-map"
      title="Native Land Digital territory map"
      src="https://native-land.ca/api/embed/embed.html?maps=territories&name=nipmuck&key=P9Ygk7-EHYccQvfi7TtaG"
      allow="geolocation"
      scrolling="yes"
    ></iframe>
  </div>

  <script>
    (function () {
      var button = document.getElementById('locate-me');
      var status = document.getElementById('location-status');
      var map = document.getElementById('native-land-map');
      var fallbackUrl = map.src;

      if (!navigator.geolocation) {
        button.disabled = true;
        status.textContent = 'Location is not available in this browser. Showing Nipmuc territory.';
        return;
      }

      button.addEventListener('click', function () {
        button.disabled = true;
        status.textContent = 'Requesting your location… This can take up to 30 seconds.';

        navigator.geolocation.getCurrentPosition(
          function (position) {
            var mapUrl = new URL(fallbackUrl);
            var latitude = position.coords.latitude.toFixed(3);
            var longitude = position.coords.longitude.toFixed(3);

            mapUrl.searchParams.delete('name');
            mapUrl.searchParams.set('position', latitude + ',' + longitude);
            map.src = mapUrl.toString();

            status.textContent = 'Showing territories at your approximate location. Coordinates were sent to Native Land Digital.';
            button.disabled = false;
          },
          function (error) {
            var message = 'Location was unavailable. Showing Nipmuc territory.';

            if (error.code === error.PERMISSION_DENIED) {
              message = 'Location permission was declined. Showing Nipmuc territory.';
            } else if (error.code === error.TIMEOUT) {
              message = 'Location request timed out. Check your browser or computer Location Services, then try again. Showing Nipmuc territory.';
            }

            status.textContent = message;
            button.disabled = false;
          },
          {
            enableHighAccuracy: false,
            timeout: 30000,
            maximumAge: 3600000
          }
        );
      });
    }());
  </script>
</body>
</html>
