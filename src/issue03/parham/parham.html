    <meta
      name="DCTERMS.abstract"
      content=".break .dance is an experimental digital project that uses Beyoncé’s visual album Lemonade as a keystone text to ground musings about time, code, and internet experience—a set of contemplations produced in response to the theme Slavery in the Machine. .break .dance includes discussions of Flying Lotus’s “Never Catch Me” (feat. Kendrick Lamar); Toni Morrison’s portrayal of Baby Suggs in Beloved; Beyoncé’s “Formation”; and “Becky,” from Jean Toomer’s Cane. The critical work in .break .dance emerges from contemplations of M. NourbeSe Philip’s Zong! and Kwame Dawes’s “Stop Time.”"
    />
