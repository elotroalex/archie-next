# archipelagos — caching rules for the production .htaccess
#
# NOT deployed by prod.sh. The server's .htaccess is hand-managed and on the
# rsync exclude list (it carries the PHP handler, the legacy Jekyll redirects
# and the X-Robots-Tag guard), so this block has to be appended to it by hand,
# once. Kept in the repo so the rules are reviewable and recoverable rather
# than living only on a shared host. See README.md, "Caching".
#
# The problem it solves: the host sends NO Cache-Control and no ETag on HTML,
# only Last-Modified. With no explicit freshness, browsers fall back to
# *heuristic* caching — roughly 10% of the document's age at the moment it was
# fetched. rsync leaves an unchanged file's mtime alone, so a two-year-old
# article is served with a two-year-old Last-Modified, and a reader's browser
# treats its copy as fresh for ~2.4 months without ever asking the server
# again. Edit that article and ship it, and that reader keeps seeing the old
# text until they hard-refresh. New pages look fine because there was nothing
# cached to go stale — which is exactly the reported symptom.
#
# Static assets have the opposite problem: the host sets max-age=604800 on
# css/js/images, so a stylesheet change is invisible for up to a week.

<IfModule mod_rewrite.c>
  RewriteEngine On
  RewriteCond %{QUERY_STRING} (^|&)v=[0-9a-f]
  RewriteRule ^ - [E=FINGERPRINTED:1]
</IfModule>

<IfModule mod_headers.c>
  # Documents revalidate on every visit. "no-cache" does not mean "don't
  # store" — the copy is kept and reused, the browser just asks first, and
  # the answer is a 304 with an empty body unless the page actually changed.
  <FilesMatch "\.(html|json|xml|txt)$">
    Header set Cache-Control "no-cache, must-revalidate"
    Header unset Expires
    Header unset Pragma
  </FilesMatch>

  # Anything requested with a ?v=<content hash> is immutable by construction:
  # change the file and its URL changes with it (the `bust` filter in
  # .eleventy.js). Keyed off the query string rather than a path or extension
  # so it can never freeze an un-fingerprinted file — the interactives' own
  # JS under /issueXX/, /public/js/special/multiverse.js, article images, the
  # PDFs in /assets/ — which all keep the host's default week.
  #
  # The env var is set by mod_rewrite rather than by mod_setenvif, which was
  # not a style choice — both of the obvious mod_setenvif forms were tried
  # against this host and neither works:
  #
  #   SetEnvIf Query_String ...   mod_setenvif's plain form understands only a
  #                               short list of special names (Remote_Host,
  #                               Remote_Addr, Server_Addr, Request_Method,
  #                               Request_Protocol, Request_URI) and treats any
  #                               other name as an HTTP request header. This
  #                               matches a "Query-String" header no client
  #                               sends: it never fires and never errors.
  #                               Request_URI is no help either — it is the
  #                               path only, query string stripped.
  #   SetEnvIfExpr "%{QUERY_STRING} =~ ..."
  #                               correct syntax, parses without a 500, and
  #                               sets nothing at all on this server. Verified
  #                               with a probe header: a sibling
  #                               `SetEnvIf Request_URI` in the same file set
  #                               its variable, this one did not.
  #
  # mod_rewrite is already required here for the www -> non-www canonical
  # redirect above, so this adds no new dependency. The rule has no
  # substitution and no [L]: it sets a variable and falls through.
  Header set Cache-Control "public, max-age=31536000, immutable" env=FINGERPRINTED

  # mod_headers overrides mod_expires for Cache-Control (confirmed by probe),
  # but leaves mod_expires' Expires header in place, and a stale absolute
  # Expires alongside a one-year max-age is a contradiction old caches may
  # resolve the wrong way. Drop it and let Cache-Control be the only answer.
  Header unset Expires env=FINGERPRINTED
</IfModule>
